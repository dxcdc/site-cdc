name: 🚀 Deploy Automático Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Deploy via SSH na VPS Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            cd /var/www/site-cdc || git clone git@github.com:dxcdc/site-cdc.git /var/www/site-cdc
            cd /var/www/site-cdc
            git pull --ff-only origin main
            docker compose build
            docker compose up -d postgres
            docker compose run --rm backend npm run migrate
            docker compose up -d
            docker compose ps
