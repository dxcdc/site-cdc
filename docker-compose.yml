version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL Containerizado
  postgres:
    image: postgres:16-alpine
    container_name: site_cdc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-site_cdc_db}
      POSTGRES_USER: ${DB_USER:-cdc_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cdc_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cdc_user} -d ${DB_NAME:-site_cdc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Express Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: site_cdc_backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DB_HOST: postgres
      DB_USER: ${DB_USER:-cdc_user}
      DB_NAME: ${DB_NAME:-site_cdc_db}
      DB_PASSWORD: ${DB_PASSWORD:-cdc_password}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      LOCAL_STORAGE_PATH: /app/uploads
    ports:
      - "5001:8080"
    volumes:
      - ./backend/src:/app/src:z
      - ./uploads:/app/uploads:z
      - ./frontend/public/assets:/app/public/assets:z
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Painel Administrativo AdminJS
  painel-admin:
    build:
      context: ./painel-admin
      dockerfile: Dockerfile
    container_name: site_cdc_admin
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DB_HOST: postgres
      DB_USER: ${DB_USER:-cdc_user}
      DB_NAME: ${DB_NAME:-site_cdc_db}
      DB_PASSWORD: ${DB_PASSWORD:-cdc_password}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET:-secret_cookie_cdc_key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
    ports:
      - "3001:8080"
    volumes:
      - ./painel-admin/config:/usr/src/app/config:z
      - ./painel-admin/routes:/usr/src/app/routes:z
      - ./painel-admin/index.js:/usr/src/app/index.js:z
      - ./uploads:/usr/src/app/uploads:z
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Frontend Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são embutidas no bundle durante o build.
        # Devem ser passadas como ARG, não como environment runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    container_name: site_cdc_frontend
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
