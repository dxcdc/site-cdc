services:
  # 1. Banco de Dados PostgreSQL Containerizado
  postgres:
    image: postgres:16-alpine
    container_name: site_cdc_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME deve ser configurado}
      POSTGRES_USER: ${DB_USER:?DB_USER deve ser configurado}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD deve ser configurado}
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${PORT_DATABASE:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER deve ser configurado} -d ${DB_NAME:?DB_NAME deve ser configurado}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Express Backend REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: site_cdc_backend
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DB_HOST: postgres
      DB_USER: ${DB_USER:?DB_USER deve ser configurado}
      DB_NAME: ${DB_NAME:?DB_NAME deve ser configurado}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD deve ser configurado}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      API_INTEGRATION_KEY: ${API_INTEGRATION_KEY:-}
      LOCAL_STORAGE_PATH: /app/uploads
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_BACKEND:-5001}:8080"
    volumes:
      - ./backend/src:/app/src:z
      - ./uploads:/app/uploads:z
      - ./frontend/public/assets:/app/public/assets:z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Painel Administrativo AdminJS
  painel-admin:
    build:
      context: ./painel-admin
      dockerfile: Dockerfile
    container_name: site_cdc_admin
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DB_HOST: postgres
      DB_USER: ${DB_USER:?DB_USER deve ser configurado}
      DB_NAME: ${DB_NAME:?DB_NAME deve ser configurado}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD deve ser configurado}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_ADMIN:-3001}:8080"
    volumes:
      - ./painel-admin/config:/usr/src/app/config:z
      - ./painel-admin/routes:/usr/src/app/routes:z
      - ./painel-admin/index.js:/usr/src/app/index.js:z
      - ./uploads:/usr/src/app/uploads:z
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Frontend Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são embutidas no bundle durante o build.
        # Devem ser passadas como ARG, não como environment runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    container_name: site_cdc_frontend
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_FRONTEND:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
